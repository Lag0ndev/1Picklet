<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1Picklet | Picklet Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Rubik+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-container">
    <div class="tile"></div>
  </div>

  <!-- Topbar -->
  <nav class="topbar">
    <div class="logo">1Picklet</div>
  </nav>

  <!-- Main Content -->
  <main class="page">
    <header class="hero">
      <h1>1Picklet</h1>
      <p class="tagline">The Picklet Hub</p>
      <p class="desc">Look up any Picklet account</p>
    </header>

    <div class="search-wrap">
      <form class="search-form" action="#" method="get" role="search">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input
            type="search"
            name="q"
            class="search-input"
            placeholder="Search Picklet accounts…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search Picklet accounts"
          />
        </div>
      </form>
    </div>
  </main>
</body>
</html>
