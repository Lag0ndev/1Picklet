<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1Picklet | Picklet Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Rubik+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-container">
    <div class="bg-pattern"></div>
  </div>

  <!-- Topbar -->
  <nav class="topbar">
    <div class="logo">1Picklet</div>
    <div class="nav">
      <a href="#" class="navlink" aria-current="page" title="Home">🏠</a>
      <a href="#" class="navlink" title="Explore">🔍</a>
      <a href="#" class="navlink" title="Clans">🛡️</a>
      <a href="#" class="navlink" title="Store">🛒</a>
      <a href="#" class="navlink" title="Profile">👤</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="page">
    <header class="hero">
      <h1>1Picklet</h1>
      <p class="tagline">The Picklet Hub</p>
      <p class="desc">Welcome to the central place for everything Picklet.</p>
    </header>

    <section class="section">
      <h2 class="section-title">Featured</h2>
      <div class="grid">
        <div class="soft-panel">
          <div class="panel-icon">🥒</div>
          <div>
            <h3>Picklet Core</h3>
            <p>The heart of the hub.</p>
          </div>
        </div>
        <div class="soft-panel">
          <div class="panel-icon">⚡</div>
          <div>
            <h3>Quick Join</h3>
            <p>Jump into the action.</p>
          </div>
        </div>
        <div class="soft-panel">
          <div class="panel-icon">🏆</div>
          <div>
            <h3>Leaderboard</h3>
            <p>See who's on top.</p>
          </div>
        </div>
        <div class="soft-panel">
          <div class="panel-icon">💬</div>
          <div>
            <h3>Community</h3>
            <p>Chat & connect.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">More</h2>
      <div class="wide-panel">
        <div class="soft-panel mini">
          <span>News</span>
        </div>
        <div class="soft-panel mini">
          <span>Events</span>
        </div>
        <div class="soft-panel mini">
          <span>Guides</span>
        </div>
        <div class="soft-panel mini">
          <span>Support</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
